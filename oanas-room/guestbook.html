<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guestbook — Oana's Room</title>
<style>
@font-face {
  font-family: 'OanaSoulHand';
  src: url('./OanaSoulHand-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

:root {
  --cream: #FFF9F5;
  --pink-light: #FFF0F0;
  --pink: #FFDDE4;
  --pink-mid: #F5B8C4;
  --pink-dark: #D4849A;
  --brown: #6B4C4C;
  --brown-light: #8C6B6B;
  --white: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "PingFang SC", sans-serif;
  background: var(--cream);
  color: var(--brown);
  line-height: 1.8;
  min-height: 100vh;
  overflow: hidden;
}

.back {
  position: fixed;
  top: 20px;
  left: 20px;
  text-decoration: none;
  color: var(--pink-mid);
  font-size: 14px;
  z-index: 50;
  transition: color 0.2s;
}
.back:hover { color: var(--pink-dark); }

.page-title {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'OanaSoulHand', cursive;
  font-size: clamp(24px, 4vw, 32px);
  color: var(--pink-dark);
  z-index: 50;
}

/* Danmaku area */
.danmaku-area {
  position: fixed;
  top: 80px;
  left: 0;
  right: 0;
  bottom: 140px;
  overflow: hidden;
  pointer-events: none;
}

.danmaku {
  position: absolute;
  white-space: nowrap;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  color: var(--brown);
  background: var(--white);
  box-shadow: 0 2px 8px rgba(107, 76, 76, 0.08);
  animation: danmakuMove var(--duration) linear forwards;
  pointer-events: auto;
}

.danmaku .name {
  font-size: 11px;
  color: var(--pink-mid);
  margin-left: 8px;
}

@keyframes danmakuMove {
  0% { transform: translateX(100vw); }
  100% { transform: translateX(-100%); }
}

/* Input area */
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  padding: 16px 24px;
  box-shadow: 0 -2px 12px rgba(107, 76, 76, 0.06);
  z-index: 50;
}

.input-row {
  max-width: 500px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: center;
}

.input-row input[type="text"] {
  flex: 1;
  border: 1.5px solid var(--pink-light);
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 14px;
  outline: none;
  color: var(--brown);
  background: var(--cream);
  transition: border-color 0.2s;
}

.input-row input[type="text"]:focus {
  border-color: var(--pink-mid);
}

.input-row input[type="text"]::placeholder {
  color: var(--pink-mid);
}

.input-row .name-input {
  width: 90px;
  flex: none;
}

.input-row button {
  padding: 10px 18px;
  background: var(--pink);
  border: none;
  border-radius: 20px;
  font-size: 13px;
  color: var(--pink-dark);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.input-row button:hover {
  background: var(--pink-mid);
  color: white;
}

/* Secret folder */
.secret-folder {
  position: fixed;
  bottom: 90px;
  right: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  z-index: 40;
  transition: transform 0.2s;
}

.secret-folder:hover {
  transform: scale(1.08);
}

.folder-icon {
  width: 40px;
  height: 36px;
}

.folder-label {
  font-family: 'OanaSoulHand', cursive;
  font-size: 14px;
  color: var(--pink-dark);
}

.secret-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--white);
  border-radius: 16px;
  padding: 24px 32px;
  box-shadow: 0 8px 32px rgba(107, 76, 76, 0.15);
  z-index: 100;
  display: none;
  text-align: center;
  min-width: 200px;
}

.secret-popup.show {
  display: block;
  animation: popIn 0.3s ease;
}

@keyframes popIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.secret-content {
  font-size: 15px;
  color: var(--brown);
  line-height: 1.8;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--brown);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  z-index: 60;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Empty state */
.empty-hint {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px;
  color: var(--pink-mid);
  text-align: center;
}
</style>
</head>
<body>

<a href="./index.html#nav" class="back">← back to room</a>
<h1 class="page-title">Guestbook ✦</h1>

<div class="danmaku-area" id="danmakuArea">
  <div class="empty-hint" id="emptyHint">还没有留言，发一条弹幕吧 ✿</div>
</div>

<div class="input-area">
  <div class="input-row">
    <input type="text" id="msgInput" placeholder="说点什么～" />
    <input type="text" id="nameInput" class="name-input" placeholder="署名" />
    <button onclick="postMessage()">发射 ♡</button>
  </div>
</div>

<div class="toast" id="toast">发射成功 ✿</div>

<!-- Secret folder -->
<div class="secret-folder" id="secretFolder" onclick="clickSecret()">
  <div class="folder-icon"><svg viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 8C4 6 5.5 4 8 4H18L22 8H40C42.5 8 44 10 44 12V32C44 34 42.5 36 40 36H8C5.5 36 4 34 4 32V8Z" fill="#FFDDE4" stroke="#F5B8C4" stroke-width="2"/><path d="M4 12H44V32C44 34 42.5 36 40 36H8C5.5 36 4 34 4 32V12Z" fill="#FFE8EE"/></svg></div>
  <div class="folder-label">my secret</div>
</div>

<div class="secret-popup" id="secretPopup">
  <div class="secret-content" id="secretContent"></div>
</div>

<script>
const SUPABASE_URL = 'https://pgtnxreyvamuuxdgnahx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PeRCPvU_xjdkVtdJQlZ56A_mSnTLqS7';

const danmakuArea = document.getElementById('danmakuArea');
const emptyHint = document.getElementById('emptyHint');
let messages = [];

// Load and launch all messages as danmaku
loadMessages();

async function loadMessages() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook?select=*&order=created_at.desc&limit=100`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    }
  });
  messages = await res.json();
  
  if (messages.length > 0) {
    emptyHint.style.display = 'none';
    launchAllDanmaku();
  }
}

function launchAllDanmaku() {
  const areaHeight = danmakuArea.offsetHeight;
  const lanes = Math.floor(areaHeight / 48);
  
  messages.forEach((msg, i) => {
    setTimeout(() => {
      spawnDanmaku(msg.message, msg.name || '匿名', i % lanes);
    }, i * 800 + Math.random() * 500);
  });

  // Loop: after all launched, restart
  const totalTime = messages.length * 800 + 15000;
  setTimeout(() => launchAllDanmaku(), totalTime);
}

function spawnDanmaku(text, name, lane) {
  const el = document.createElement('div');
  el.className = 'danmaku';
  el.innerHTML = `${escapeHtml(text)}<span class="name">${escapeHtml(name)}</span>`;
  
  const duration = 12 + Math.random() * 6; // 12-18s
  el.style.setProperty('--duration', duration + 's');
  el.style.top = (lane * 48 + 8) + 'px';
  
  danmakuArea.appendChild(el);
  
  // Remove after animation
  el.addEventListener('animationend', () => el.remove());
}

async function postMessage() {
  const msg = document.getElementById('msgInput').value.trim();
  const name = document.getElementById('nameInput').value.trim() || '匿名';
  
  if (!msg) return;

  const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ message: msg, name: name })
  });

  if (res.ok) {
    // Immediately show as danmaku
    emptyHint.style.display = 'none';
    const lane = Math.floor(Math.random() * Math.floor(danmakuArea.offsetHeight / 48));
    spawnDanmaku(msg, name, lane);
    
    document.getElementById('msgInput').value = '';
    document.getElementById('nameInput').value = '';
    showToast();
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Secret folder
let secretClicks = 0;
const secretMessages = [
  '不告诉你 ♡',
  '再点一次才告诉你～',
  '骗你的，还是不说 ☺',
  '别点了！！！',
  '你怎么还点啊',
  '好吧…其实也没有什么秘密',
  '只是想看你会不会一直点下去',
  '你果然会 ♡',
  '好啦，秘密就是——希望点到这里的你，天天开心 ♡',
];

const popup = document.getElementById('secretPopup');
const secretContent = document.getElementById('secretContent');

function clickSecret() {
  const msg = secretMessages[Math.min(secretClicks, secretMessages.length - 1)];
  secretContent.textContent = msg;
  popup.classList.add('show');
  secretClicks++;
  
  setTimeout(() => {
    popup.classList.remove('show');
  }, 1800);
}
</script>

</body>
</html>
